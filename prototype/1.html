<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex — Home</title>
    <style>
      :root {
        --sidebar-w: 299px;
        --toolbar-h: 44px;
        --row-h: 30px;
        --row-radius: 10px;
        --px-row-x: 8px;
        --bg-app: #f4f4f5;
        --bg-hover: rgba(0, 0, 0, 0.045);
        --text-primary: #212124;
        --text-tertiary: #6f6f74;
        --text-muted: #97979c;
        --text-placeholder: #9c9ca1;
        --border-color: #e5e5e8;
        --card-bg: #fcfcfd;
        --card-border: #e7e7ea;
        --utility-bg: #ebebee;
        --composer-bg: rgba(252, 252, 253, 0.92);
        --orange: #c2570b;
        --blue: #3b82f6;
        --purple: #a855f7;
        --green: #22c55e;
        --chart-orange: #ea580c;
        --dot-blue: #3f8cfa;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        background: var(--bg-app);
        color: var(--text-primary);
        font-size: 14px;
      }
      button {
        font-family: inherit;
        border: none;
        background: none;
        cursor: pointer;
        color: inherit;
      }
      svg {
        display: block;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .app-body {
        position: relative;
        display: flex;
        flex: 1;
        min-height: 0;
      }

      /* ============ SIDEBAR ============ */
      aside.sidebar {
        position: relative;
        width: var(--sidebar-w);
        min-width: var(--sidebar-w);
        padding-top: var(--toolbar-h);
        background: var(--bg-app);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
      }
      .side-nav {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      .side-top {
        padding: 2px var(--px-row-x) 6px;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--row-h);
        padding: 0 8px;
        border-radius: var(--row-radius);
        text-align: left;
        font-size: 14px;
        color: var(--text-primary);
        width: 100%;
      }
      .row:hover {
        background: var(--bg-hover);
      }
      .row .ric {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .row .ric svg {
        width: 16px;
        height: 16px;
      }
      .row .rlabel {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .kbd-chip {
        flex-shrink: 0;
        opacity: 0;
        pointer-events: none;
        display: inline-flex;
        align-items: center;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.08);
        font-family: inherit;
        font-size: 12px;
        line-height: 1;
        padding: 4px 6px;
        color: var(--text-primary);
      }
      .row:hover .kbd-chip {
        opacity: 1;
      }

      .side-scroll {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-bottom: 54px;
      }
      .side-section {
        padding: 0 var(--px-row-x);
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .side-section + .side-section {
        margin-top: 14px;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 2px 2px 8px;
      }
      .section-title {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        padding: 2px 4px 2px 0;
        border-radius: 6px;
        cursor: default;
        flex: 1;
      }
      .section-title .chev {
        opacity: 0;
        width: 14px;
        height: 14px;
      }
      .section-header:hover .chev {
        opacity: 0.6;
      }
      .section-controls {
        display: flex;
        align-items: center;
        gap: 4px;
        opacity: 0;
        pointer-events: none;
      }
      .section-header:hover .section-controls {
        opacity: 1;
        pointer-events: auto;
      }
      .icon-btn-sm {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(33, 33, 36, 0.5);
      }
      .icon-btn-sm:hover {
        color: var(--text-primary);
      }
      .icon-btn-sm svg {
        width: 16px;
        height: 16px;
      }

      .project-list {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding-top: 4px;
      }
      .project-row {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: var(--row-h);
        padding-left: 4px;
        border-radius: var(--row-radius);
        font-size: 14px;
        color: var(--text-primary);
        overflow: hidden;
        cursor: pointer;
      }
      .project-row:hover {
        background: var(--bg-hover);
      }
      .project-row .left {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1;
        padding-left: 1px;
      }
      .project-row .fic {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        margin-left: 3px;
      }
      .project-row .fic svg {
        width: 16px;
        height: 16px;
      }
      .project-row .pname {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding-right: 4px;
      }
      .project-row .right {
        display: flex;
        align-items: center;
        gap: 4px;
        max-width: 50%;
        min-width: 0;
      }
      .row-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        opacity: 0;
        pointer-events: none;
        padding-right: 2px;
      }
      .project-row:hover .row-actions {
        opacity: 1;
        pointer-events: auto;
      }
      .status-dot-wrap {
        width: 24px;
        height: 24px;
        margin-right: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dot-blue);
      }
      .project-row:hover .status-dot-wrap {
        visibility: hidden;
      }

      .empty-tasks {
        padding: 8px;
        font-size: 14px;
        color: #a6a6ab;
      }

      /* sidebar footer */
      .side-footer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 46px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 var(--px-row-x);
      }
      .side-footer::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 1px;
        background: rgba(33, 33, 36, 0.1);
      }
      .settings-btn {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        height: var(--row-h);
        padding: 0 8px;
        border-radius: var(--row-radius);
        font-size: 14px;
        color: var(--text-primary);
        text-align: left;
      }
      .settings-btn:hover {
        background: var(--bg-hover);
      }
      .settings-btn svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      .help-btn {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-tertiary);
      }
      .help-btn:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
      }
      .help-btn svg {
        width: 20px;
        height: 20px;
      }

      /* resize handle */
      .resize-handle {
        position: absolute;
        top: 0;
        bottom: 0;
        right: -8px;
        width: 16px;
        cursor: col-resize;
        z-index: 20;
      }
      .resize-handle .line {
        width: 1px;
        height: 100%;
        margin: auto;
        opacity: 0;
        background: linear-gradient(to bottom, transparent, rgba(33, 33, 36, 0.25), transparent);
      }
      .resize-handle:hover .line {
        opacity: 1;
      }

      /* ============ MAIN ============ */
      main.main {
        position: relative;
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      /* top header */
      header.topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--toolbar-h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 8px 0 6px;
        z-index: 30;
        pointer-events: none;
      }
      header.topbar .grp {
        display: flex;
        align-items: center;
        gap: 4px;
        pointer-events: auto;
      }
      .hdr-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-tertiary);
      }
      .hdr-btn:hover:not(:disabled) {
        background: var(--bg-hover);
      }
      .hdr-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .hdr-btn svg {
        width: 20px;
        height: 20px;
      }

      /* hero */
      .hero {
        position: absolute;
        top: 289px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        width: max-content;
        max-width: 100%;
      }
      .home-icon {
        width: 56px;
        height: 56px;
        color: var(--text-primary);
        opacity: 0.3;
        position: relative;
      }
      .home-icon svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .heading {
        font-size: 24px;
        font-weight: 400;
        color: var(--text-primary);
        text-align: center;
        white-space: pre-wrap;
        line-height: 32px;
        user-select: none;
      }
      .heading .proj-link {
        display: inline-block;
        font-size: inherit;
        color: inherit;
        text-decoration: underline dotted rgba(111, 111, 116, 0.9);
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }
      .heading .proj-link:hover {
        color: #55555a;
      }

      /* suggestion cards */
      .suggestions {
        position: absolute;
        top: 433px;
        left: 50%;
        transform: translateX(-50%);
        width: 714px;
        max-width: calc(100% - 48px);
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .sugg-card {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        text-align: left;
        min-height: 104px;
        height: 100%;
        border: 1px solid var(--card-border);
        background: var(--card-bg);
        border-radius: 16px;
        padding: 12px 16px;
        box-shadow:
          0 2px 8px rgba(0, 0, 0, 0.04),
          0 1px 2px rgba(0, 0, 0, 0.04);
        cursor: pointer;
      }
      .sugg-card:hover {
        background: #f2f2f4;
      }
      .sugg-card .s-icon {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
      }
      .sugg-card .s-icon svg {
        width: 20px;
        height: 20px;
      }
      .sugg-card .s-label {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: 40px;
        font-size: 13px;
        line-height: 20px;
        font-weight: 500;
        color: var(--text-primary);
      }
      .c-blue {
        color: var(--blue);
      }
      .c-purple {
        color: var(--purple);
      }
      .c-green {
        color: var(--green);
      }
      .c-orange {
        color: var(--chart-orange);
      }

      /* composer */
      .composer-wrap {
        position: absolute;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: 738px;
        max-width: calc(100% - 32px);
        display: flex;
        flex-direction: column;
      }
      .utility-bar {
        margin: 0 12px -23px;
        background: var(--utility-bg);
        border-radius: 16px 16px 0 0;
        padding: 8px 8px 27px;
        display: flex;
        align-items: center;
        gap: 4px;
        overflow: hidden;
      }
      .util-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 6px;
        border-radius: 999px;
        font-size: 13px;
        color: var(--text-primary);
        flex-shrink: 0;
      }
      .util-pill:hover {
        background: rgba(0, 0, 0, 0.05);
      }
      .util-pill .uic {
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .util-pill .uic svg {
        width: 16px;
        height: 16px;
      }
      .util-pill .uval {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 240px;
      }

      .composer-surface {
        position: relative;
        z-index: 10;
        background: var(--composer-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 16px;
        border: 1px solid rgba(0, 0, 0, 0.05);
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.07),
          0 2px 6px rgba(0, 0, 0, 0.04);
        display: flex;
        flex-direction: column;
      }
      .composer-input {
        width: 100%;
        border: none;
        outline: none;
        resize: none;
        background: transparent;
        padding: 12px 12px 2px;
        font-family: inherit;
        font-size: 16px;
        line-height: 22px;
        color: var(--text-primary);
        height: 48px;
      }
      .composer-input::placeholder {
        color: var(--text-placeholder);
      }
      .composer-footer {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 8px 8px;
        user-select: none;
      }
      .cf-left {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
      }
      .cf-right {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        min-width: 0;
      }
      .plus-btn {
        width: 32px;
        height: 32px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-primary);
        flex-shrink: 0;
      }
      .plus-btn:hover {
        background: rgba(0, 0, 0, 0.05);
      }
      .plus-btn svg {
        width: 20px;
        height: 20px;
      }
      .access-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 6px;
        border-radius: 999px;
        font-size: 13px;
        color: var(--orange);
      }
      .access-btn:hover {
        background: rgba(0, 0, 0, 0.05);
      }
      .access-btn svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .reasoning {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #8b8b90;
        white-space: nowrap;
      }
      .reasoning .effort {
        flex-shrink: 0;
      }
      .send-btn {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        flex-shrink: 0;
        background: rgba(28, 28, 30, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-left: 4px;
      }
      .send-btn svg {
        width: 16px;
        height: 16px;
        color: #f4f4f5;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="app-body">
        <!-- ==================== SIDEBAR ==================== -->
        <aside class="sidebar">
          <div class="side-nav">
            <!-- top actions -->
            <div class="side-top">
              <button type="button" class="row">
                <span class="ric">

                <span class="kbd-chip" aria-hidden="true">⌘N</span>
              </button>
              <button type="button" class="row">
                <span class="ric">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 16 16"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path

                      fill="currentColor"
                    ></path>
                  </svg>
                </span>
                <span class="rlabel">Search</span>
                <span class="kbd-chip" aria-hidden="true">⌘K</span>
              </button>
            </div>

            <div class="side-scroll">
              <!-- Scheduled / Plugins -->
              <div class="side-section">
                <button type="button" class="row">
                  <span class="ric">
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 16 16"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
