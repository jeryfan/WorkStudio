<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Hover Card — agent-explore</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #1a1a1a;
  }
  :root {
    --token-foreground: #1a1a1a;
    --token-description-foreground: #5c5c5c;
    --token-border: #e5e5e5;
    --token-list-hover: rgba(0, 0, 0, 0.05);
    --sidebar-icon-tint: #a3a3a3;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    margin: 0;
    padding: 0;
  }

  /* ============ 卡片根容器：320 x 150，padding 8，gap 6 ============ */
  .project-hover-card {
    position: absolute;
    left: 270px;
    top: 325px;
    width: 320px;
    height: 150px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    line-height: 18.5714px;
    color: var(--token-foreground);
    overflow-wrap: break-word;
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05), 0 6px 16px rgba(0, 0, 0, 0.08);
  }

  /* 顶部区块（标题 + tasks），gap 4 */
  .card-top {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  /* 通用行 grid：16px 图标列 + 1fr 内容列 */
  .card-row {
    display: grid;
    grid-template-columns: 1rem minmax(0, 1fr);
    column-gap: 6px;
    align-items: center;
    min-width: 0;
    border-radius: 6px;
  }
  .card-row.with-trailing {
    grid-template-columns: 1rem minmax(0, 1fr) 1.25rem;
  }

  /* 图标单元格 */
  .icon-cell {
    height: 20px;
    width: 16px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--token-description-foreground);
  }
  .icon-cell svg { display: block; flex-shrink: 0; }

  /* marker（文件夹）按钮 */
  .marker-btn {
    width: 16px;
    height: 20px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer;
    user-select: none;
    color: inherit;
  }
  .marker-btn:hover { background: var(--token-list-hover); }
  .marker-btn:focus-visible {
    outline: none;
    background: var(--token-list-hover);
  }

  /* 标题行右侧内容 */
  .title-flex {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1;
  }
  .title-flex > span:first-child { min-width: 0; flex: 1; }
  .title-btn {
    display: inline-block;
    max-width: 100%;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: start;
    font-size: 15px;
    line-height: 24px;
    font-weight: 500;
    color: var(--token-foreground);
    border-radius: 6px;
    cursor: pointer;
  }
  .title-btn:hover { background: var(--token-list-hover); }
  .title-btn:focus-visible {
    outline: none;
    background: var(--token-list-hover);
  }

  /* pin 按钮 */
  .pin-btn {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    cursor: pointer;
    color: var(--sidebar-icon-tint);
  }
  .pin-btn:hover { color: #6f6f6f; }

  /* tasks 文本 */
  .tasks-text {
    display: flex;
    min-width: 0;
    flex: 1;
    flex-wrap: wrap;
    font-size: 13px;
    line-height: 20px;
    color: var(--token-foreground);
  }
  .tasks-text > span { white-space: nowrap; }

  /* 分割线区块：border-t + pt 6 */
  .divider-section {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    border-top: 1px solid var(--token-border);
    padding-top: 6px;
  }

  /* 可 hover 的整行按钮（路径 / Edit project） */
  .row-btn {
    display: grid;
    column-gap: 6px;
    grid-template-columns: 1rem minmax(0, 1fr);
    align-items: center;
    min-width: 0;
    width: 100%;
    border-radius: 6px;
    cursor: pointer;
    text-align: start;
  }
  .row-btn.with-trailing { grid-template-columns: 1rem minmax(0, 1fr) 1.25rem; }
  .row-btn:hover { background: var(--token-list-hover); }
  .row-btn:focus-visible {
    background: var(--token-list-hover);
    outline: 2px solid #4c9aff;
    outline-offset: 2px;
  }

  /* 路径文本：两行，break-all */
  .path-text {
    min-width: 0;
    flex: 1;
    font-size: 13px;
    line-height: 20px;
    color: var(--token-foreground);
    word-break: break-all;
  }

  /* 行尾外部链接图标：默认隐藏，hover / focus 时显示 */
  .trailing-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--sidebar-icon-tint);
    opacity: 0;
  }
  .row-btn:hover .trailing-icon,
  .row-btn:focus-visible .trailing-icon { opacity: 1; }

  .edit-text {
    display: inline-block;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    line-height: 20px;
    color: var(--token-foreground);
  }
</style>
</head>
