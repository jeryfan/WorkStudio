<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex — What should we build?</title>
<style>
:root{
  --fg:#1a1c1f;
  --fg-secondary:rgba(26,28,31,.6);
  --fg-tertiary:rgba(26,28,31,.494);
  --fg-placeholder:rgba(26,28,31,.35);
  --border:rgba(26,28,31,.08);
  --hover:rgba(26,28,31,.055);
  --page-bg:#f4f4f5;
  --white:#fff;
  --warning:#e25507;
  --blue:#2f6bd8; --purple:#af60df; --green:#19975d; --orange:#e25507;
  --shadow-pop:0 0 0 .5px rgba(26,28,31,.08),0 0 0 .5px rgba(26,28,31,.08),0 8px 16px -4px rgba(0,0,0,.12);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:var(--font);background:var(--page-bg);color:var(--fg);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
svg{display:block}
/* ---------- shell ---------- */
.main{position:relative;height:100%;display:flex;flex-direction:column}
.topbar{position:absolute;top:16px;right:16px;display:flex;gap:12px;z-index:20}
.topbar button{width:20px;height:20px;color:rgba(26,28,31,.55);display:flex;align-items:center;justify-content:center;border-radius:4px}
.topbar button:hover{color:var(--fg)}
.home{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:24px}
/* ---------- hero ---------- */
.hero{display:flex;flex-direction:column;align-items:center;gap:24px;margin-bottom:28px;padding:0 16px}
.logo{width:56px;height:56px;color:var(--fg);opacity:.3}
.logo svg{width:100%;height:100%}
.heading{font-size:28px;line-height:34px;font-weight:400;text-align:center;color:var(--fg);white-space:pre-wrap}
.heading .proj-link{font-size:inherit;line-height:inherit;font-weight:400;color:var(--fg);text-decoration:underline dotted rgba(26,28,31,.494);text-decoration-thickness:1px;text-underline-offset:4px}
.heading .proj-link:hover{color:var(--fg-secondary)}
/* ---------- suggestion cards ---------- */
.suggestions{width:min(736px,100%);margin:0 auto 127px;padding:0 13px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.suggestions{grid-template-columns:repeat(2,1fr)}}
.card{display:flex;flex-direction:column;min-height:104px;width:100%;text-align:left;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:12px 16px;box-shadow:0 4px 10px rgba(0,0,0,.04)}
.card:hover{background:#fbfbfc}
.card .cicon{width:24px;height:24px;display:flex;align-items:flex-start}
.card .clabel{margin-top:auto;display:flex;flex-direction:column;justify-content:flex-end;font-size:13px;line-height:20px;font-weight:500;color:var(--fg);min-height:40px}
/* ---------- composer ---------- */
.composer-wrap{width:min(736px,100%);margin:0 auto;position:relative}
.utility-band{margin:0 18px;height:52px;background:rgba(26,28,31,.06);border-radius:16px;display:flex;align-items:center;padding:0 8px;gap:4px;margin-bottom:-14px;position:relative;z-index:0}
.pill{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:9999px;font-size:13px;line-height:18px;color:var(--fg)}
.pill:hover{background:var(--hover)}
.pill .pic{width:16px;height:16px;color:var(--fg);display:flex}
.pill .chev{width:16px;height:16px;color:var(--fg-tertiary)}
.pill .lbl{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clear-btn{width:16px;height:16px;color:var(--fg-tertiary);opacity:0;pointer-events:none;margin-left:-2px}
.proj-group:hover .clear-btn,.clear-btn:hover{opacity:1;pointer-events:auto}
.composer{position:relative;z-index:1}
.composer-box{background:var(--white);border-radius:20px;box-shadow:0 0 0 .5px var(--border),0 8px 24px rgba(0,0,0,.07);display:flex;flex-direction:column}
.composer-input{min-height:44px;max-height:200px;overflow-y:auto;padding:12px 12px 4px;font-size:15px;line-height:20px;color:var(--fg);outline:none;white-space:pre-wrap;word-break:break-word}
.composer-input:empty::before{content:attr(data-placeholder);color:var(--fg-placeholder);pointer-events:none}
.composer-footer{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 8px;gap:8px}
.f-left,.f-right{display:flex;align-items:center;gap:5px;min-width:0}
.f-right{gap:8px}
.plus-btn{width:32px;height:32px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.plus-btn:hover{background:var(--hover)}
.access-btn{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:9999px;font-size:13px;line-height:18px;color:var(--warning)}
.access-btn:hover{background:var(--hover)}
.access-btn .aic{width:16px;height:16px}
.model-btn{display:flex;align-items:center;gap:6px;height:28px;padding:0 6px;border-radius:9999px;font-size:13px;line-height:18px;color:var(--fg-tertiary)}
.model-btn:hover{background:var(--hover)}
.model-btn .mname{font-variant-numeric:tabular-nums;white-space:nowrap}
.model-btn .meff{white-space:nowrap}
.send-btn{width:28px;height:28px;border-radius:9999px;background:var(--fg);opacity:.5;display:flex;align-items:center;justify-content:center;color:var(--white);flex-shrink:0}
.send-btn:hover{opacity:.7}
/* ---------- top menu (+) ---------- */
.top-menu{position:absolute;left:0;right:0;bottom:calc(100% + 4px);height:320px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:20px;padding:4px;z-index:50;overflow:hidden}
.tm-scroll{height:100%;overflow-y:auto}
.tm-head{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);color:var(--fg-tertiary);font-size:13px;line-height:18.57px;padding:4px 8px}
.tm-head.pt{padding-top:8px}
.tm-item{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:12.5px;font-size:13px;line-height:18.57px;text-align:left;color:var(--fg);opacity:.75}
.tm-item:hover{background:var(--hover);opacity:1}
.tm-item.selected{background:var(--hover);opacity:1}
.tm-item .tic{width:16px;height:16px;flex-shrink:0;border-radius:4px;overflow:hidden;display:flex}
.tm-item .tic img{width:100%;height:100%;object-fit:cover}
.tm-item .tic.contain img{object-fit:contain}
.tm-item .ttitle{flex-shrink:0;white-space:nowrap}
.tm-item .tdesc{flex:1;min-width:0;color:var(--fg-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm-empty{padding:5px 8px;font-size:13px;line-height:18.57px;color:var(--fg-placeholder)}
/* ---------- popovers / menus ---------- */
.pop{position:fixed;z-index:50;display:flex;flex-direction:column;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-radius:15px;box-shadow:var(--shadow-pop);padding:4px;color:var(--fg)}
.mhead{display:flex;align-items:center;min-height:24px;font-size:13px;line-height:16px;color:var(--fg-tertiary);padding:5px 8px}
.mhead .hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;width:100%}
.mhead .learn{font-size:13px;color:var(--fg-tertiary);text-decoration:underline;text-underline-offset:2px;flex-shrink:0}
.mrow{display:flex;align-items:center;gap:6px;width:100%;padding:5px 8px;border-radius:12.5px;font-size:13px;line-height:18.57px;text-align:left;color:var(--fg)}
button.mrow:hover,.mrow:hover{background:var(--hover)}
.mrow .ric{width:16px;height:16px;flex-shrink:0;opacity:.75;display:flex}
.mrow .ric svg{width:100%;height:100%}
.mrow .rname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .rcheck{width:16px;height:16px;flex-shrink:0;opacity:.75}
.mrow.disabled{opacity:.5;cursor:not-allowed}
.sep{height:1px;background:var(--border);margin:4px 8px}
.mrow.big{gap:12px}
.mrow.big .bic{width:18px;height:18px;flex-shrink:0;opacity:.75}
.mrow.big .bcol{flex:1;min-width:0;display:flex;flex-direction:column}
.mrow.big .bdesc{color:var(--fg-tertiary);white-space:normal}
.mrow.big.warn .btitle,.mrow.big.warn .bdesc,.mrow.big.warn .bic{color:var(--warning)}
.mrow.big .rcheck{width:16px;height:16px;color:var(--warning)}
/* model picker */
#popModel{width:224px}
.mp-controls{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-height:36px;padding:2px 8px 2px 0;position:relative}
.mp-advanced{display:flex;align-items:center;gap:2px;margin-left:-8px;padding:4px;border-radius:8px;font-size:13px;line-height:18.57px;color:var(--fg-tertiary)}
.mp-advanced:hover{background:var(--hover)}
.mp-advanced svg{width:16px;height:16px}
.mp-ends{display:flex;gap:24px;font-size:12px;color:var(--fg-tertiary);padding-top:6px}
.mp-slider{height:36px;display:flex;align-items:center;padding:0 10px 8px}
.mp-track{position:relative;flex:1;height:4px;border-radius:2px;background:rgba(26,28,31,.12)}
.mp-track .dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:4px;height:4px;border-radius:50%;background:rgba(26,28,31,.25)}
.mp-track .dot.on{background:var(--fg)}
.mp-track .knob{position:absolute;top:50%;left:100%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25)}
/* tooltip */
.tooltip{position:fixed;z-index:50;background:var(--white);border:1px solid var(--border);border-radius:12.5px;padding:4px 8px;font-size:13px;line-height:18.57px;color:var(--fg);max-width:320px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tooltip .tinner{display:flex;align-items:center;gap:8px}
.tooltip .ttext{text-align:center}
/* search input */
.searchrow{display:flex;align-items:center;gap:6px;padding:5px 8px;margin-bottom:4px}
.searchrow svg{width:14px;height:14px;color:var(--fg-tertiary);flex-shrink:0}
.searchrow input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:inherit;font-size:13px;line-height:18.57px;color:var(--fg)}
.searchrow input::placeholder{color:var(--fg-placeholder)}
</style>
</head>

<!-- send tooltip -->
<div class="tooltip" id="sendTip" hidden><div class="tinner"><div class="ttext">Type a message and click send to get started</div></div></div>

<script>
(function(){
  var pops=[
    {tr:'projectTrigger',pop:'popProject',align:'center'},
    {tr:'projectSelector',pop:'popProject',align:'start'},
    {tr:'workLocal',pop:'popWork',align:'start'},
    {tr:'accessBtn',pop:'popAccess',align:'start'},
    {tr:'modelBtn',pop:'popModel',align:'end'}
  ];
  function $(id){return document.getElementById(id)}
  function closeAll(){pops.forEach(function(p){$(p.pop).hidden=true});$('topMenu').hidden=true;}
  function place(pop,tr,align){
    pop.style.visibility='hidden';pop.hidden=false;
    var t=tr.getBoundingClientRect(),r=pop.getBoundingClientRect(),l;
    if(align==='start')l=t.left;else if(align==='end')l=t.right-r.width;else l=t.left+t.width/2-r.width/2;
    var tp=t.top-r.height-6;
    pop.style.left=Math.max(8,Math.min(l,window.innerWidth-r.width-8))+'px';
    pop.style.top=Math.max(8,tp)+'px';
    pop.style.visibility='';
  }
  pops.forEach(function(p){
    var tr=$(p.tr),pop=$(p.pop);
    tr.addEventListener('click',function(e){
      e.stopPropagation();
      var wasOpen=!pop.hidden;
      closeAll();
      if(!wasOpen)place(pop,tr,p.align);
    });
    pop.addEventListener('click',function(e){e.stopPropagation();});
  });
  var plus=$('plusBtn'),topMenu=$('topMenu');
  plus.addEventListener('click',function(e){e.stopPropagation();topMenu.hidden=!topMenu.hidden;});
  topMenu.addEventListener('click',function(e){e.stopPropagation();});
  document.addEventListener('click',function(e){
    var t=e.target;
    pops.forEach(function(p){
      var pop=$(p.pop),tr=$(p.tr);
      if(!pop.hidden&&!pop.contains(t)&&!tr.contains(t))pop.hidden=true;
    });
    if(!topMenu.hidden&&!topMenu.contains(t)&&!plus.contains(t))topMenu.hidden=true;
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll();});
  /* send tooltip */
  var send=$('sendBtn'),tip=$('sendTip');
  function showTip(){
    tip.hidden=false;
    var t=send.getBoundingClientRect(),r=tip.getBoundingClientRect();
    tip.style.left=Math.max(8,t.right-r.width)+'px';
    tip.style.top=(t.top-r.height-8)+'px';
  }
  send.addEventListener('mouseenter',showTip);
  send.addEventListener('focus',showTip);
  send.addEventListener('mouseleave',function(){tip.hidden=true});
  send.addEventListener('blur',function(){tip.hidden=true});
  /* clear project (visual only) */
  $('clearProject').addEventListener('click',function(e){e.stopPropagation();});
})();
</script>
