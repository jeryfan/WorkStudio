<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar</title>
    <style>
      :root {
        --height-toolbar: 46px;
        --height-token-row: 30px;
        --height-token-nav-row: 30px;
        --padding-row-cell-x: 8px;
        --padding-row-x: 8px;
        --radius-token-row: 10px;
        --sidebar-footer-height: 46px;
        --sidebar-scroll-content-top-padding: 4px;
        --sidebar-scroll-header-fade-distance: 4px;
        --sidebar-scroll-header-fade-start: 0px;
        --sidebar-scroll-header-spacing: 4px;
        --spacing: 8px;

        --token-foreground: #1a1a2e;
        --token-foreground-50: rgba(26, 26, 46, 0.5);
        --token-foreground-25: rgba(26, 26, 46, 0.25);
        --token-foreground-10: rgba(26, 26, 46, 0.1);
        --token-description-foreground: #6b7280;
        --token-muted-foreground: #9ca3af;
        --token-list-hover-background: rgba(0, 0, 0, 0.05);
        --token-input-placeholder-foreground: #6b7280;
        --token-border: rgba(0, 0, 0, 0.1);
        --token-main-surface-primary: #ffffff;
        --token-text-tertiary: #9ca3af;
        --vscode-textLink-foreground: #007acc;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #f0f0f5;
        overflow: hidden;
      }

      .app-shell-left-panel {
        background-color: rgba(255, 255, 255, 0.6);
        display: flex;
        height: 819px;
        left: 0;
        padding-top: var(--height-toolbar);
        position: relative;
        top: 0;
        width: 293.742px;
        overflow: visible;
      }

      .panel-inner {
        min-width: 293.748px;
        width: 293.748px;
        opacity: 1;
        max-width: 100%;
        overflow: hidden;
      }

      .panel-content {
        user-select: none;
        display: flex;
        height: 100%;
        width: 100%;
        isolation: isolate;
        flex-direction: column;
        contain: layout paint;
      }

      .panel-flex-container {
        position: relative;
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
      }

      .sidebar-nav {
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        color: var(--token-muted-foreground);
      }

      .top-actions {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-left: var(--padding-row-x);
        padding-right: var(--padding-row-x);
        padding-bottom: var(--sidebar-scroll-header-spacing);
        flex-shrink: 0;
      }

      .top-actions-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .top-actions-buttons {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .nav-row-btn {
        position: relative;
        height: var(--height-token-row);
        padding-left: var(--padding-row-cell-x, var(--padding-row-x));
        padding-right: var(--padding-row-cell-x, var(--padding-row-x));
        cursor: pointer;
        flex-shrink: 0;
        align-items: center;
        overflow: hidden;
        border-radius: var(--radius-token-row);
        text-align: left;
        font-size: 14px;
        gap: 8px;
        display: flex;
        width: 100%;
        border: none;
        background: transparent;
        color: var(--token-foreground);
        transition: background-color 0.15s;
      }

      .nav-row-btn:hover {
        background-color: var(--token-list-hover-background);
      }

      .nav-row-btn .icon-wrap {
        display: flex;
        width: 16px;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
      }

      .nav-row-btn .label-wrap {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        flex: 1;
        font-size: 14px;
        color: var(--token-foreground);
      }

      .nav-row-btn .kbd-wrap {
        flex-shrink: 0;
        color: var(--token-description-foreground);
        opacity: 0;
        transition: opacity 0.15s;
      }

      .nav-row-btn:hover .kbd-wrap,
      .nav-row-btn:focus-visible .kbd-wrap {
        opacity: 1;
      }

      .kbd-badge {
        display: inline-flex;
        border-radius: 6px;
        border: none;
        background: rgba(0, 0, 0, 0.08);
        font-family: inherit;
        font-size: 12px;
        color: currentColor;
        box-shadow: none;
        padding: 2px 6px;
        line-height: 1;
      }

      .text-fade-truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .scroll-area {
        position: relative;
        isolation: isolate;
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        gap: 16px;
        overflow-x: hidden;
        overflow-y: auto;
        padding-bottom: calc(
          var(--sidebar-footer-height) + var(--padding-row-x)
        );
        margin-top: calc(-1 * var(--sidebar-scroll-header-spacing, 8px));
        padding-top: var(
          --sidebar-scroll-content-top-padding,
          var(--sidebar-scroll-header-spacing, 8px)
        );
        contain: layout paint;
      }

      .section-block {
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        gap: 8px;
      }

      .section-px {
        padding-left: var(--padding-row-x);
        padding-right: var(--padding-row-x);
      }

      .section-inner {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .section-buttons {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .section-header {
        display: flex;
        flex-direction: column;
      }

      .section-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-right: 2px;
        padding-left: 8px;
        min-width: 0;
        flex: 1;
        font-size: 13px;
        font-weight: 500;
        color: var(--token-input-placeholder-foreground);
        opacity: 0.75;
      }

      .section-title-flex {
        display: flex;
        min-width: 0;
        flex: 1;
      }

      .section-toggle-btn {
        display: flex;
        min-width: 0;
        flex: 1;
        align-items: center;
        gap: 4px;
        border-radius: 6px;
        padding: 2px 4px 2px 0;
        text-align: left;
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        color: inherit;
        font-family: inherit;
      }

      .section-toggle-btn .chevron {
        flex-shrink: 0;
        transition: transform 0.2s;
        color: var(--token-foreground-50);
        opacity: 0;
        width: 20px;
        height: 21px;
      }

      .section-toggle-btn:hover .chevron,
      .section-title-row:hover .chevron {
        opacity: 1;
      }

      .section-toggle-btn.collapsed .chevron {
        transform: rotate(-90deg);
      }

      .section-content {
        overflow: hidden;
      }

      .section-content.expanded {
        height: auto;
        opacity: 1;
        overflow: visible;
      }

      .section-content.collapsed-content {
        height: 0;
        opacity: 0;
      }

      .thread-list {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding-top: 4px;
      }

      .thread-item {
        position: relative;
        height: var(--height-token-row);
        cursor: pointer;
        border-radius: var(--radius-token-row);
        font-size: 14px;
        display: flex;
        align-items: center;
        padding-left: var(--padding-row-cell-x, var(--padding-row-x));
        padding-right: var(--padding-row-cell-x, var(--padding-row-x));
        transition: background-color 0.15s;
      }

      .thread-item:hover {
        background-color: var(--token-list-hover-background);
      }

      .thread-item .hover-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        opacity: 0;
        position: absolute;
        right: 0;
        top: 0;
        z-index: 10;
        height: 100%;
        justify-content: flex-end;
        padding-right: 2px;
        margin-right: 2px;
        width: 52px;
        transition: opacity 0.15s;
      }

      .thread-item:hover .hover-actions {
        opacity: 1;
      }

      .thread-item .main-content {
        display: flex;
        height: 100%;
        width: 100%;
        align-items: center;
        font-size: 14px;
        line-height: 16px;
      }

      .thread-item .title-area {
        display: flex;
        min-width: 0;
        flex: 1;
        align-items: center;
        gap: 8px;
      }

      .thread-item .title-text-wrap {
        display: flex;
        min-width: 0;
        flex: 1;
        align-self: stretch;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        line-height: 20px;
        color: var(--token-foreground);
      }

      .thread-item .title-text {
        min-width: 0;
        user-select: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }

      .thread-item .meta-area {
        margin-left: 3px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;
        min-width: 26px;
      }

      .thread-item:hover .meta-area {
        min-width: 48px;
      }

      .thread-item .time-label {
        color: var(--token-description-foreground);
        font-size: 12px;
        line-height: 16px;
        font-variant-numeric: tabular-nums;
        text-align: right;
        white-space: nowrap;
      }

      .thread-item:hover .time-label {
        display: none;
      }

      .thread-item .status-dot {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        margin-right: -4px;
      }

      .thread-item:hover .status-dot {
        display: none;
      }

      .status-dot-inner {
        position: relative;
        display: flex;
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
        color: var(--token-description-foreground);
      }

      .status-dot-circle {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        transform: scale(0.5);
        background-color: var(--vscode-textLink-foreground);
      }

      .action-icon-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        cursor: pointer;
        padding: 0;
        width: 20px;
        height: 20px;
        color: var(--token-foreground-50);
        border-radius: 4px;
        transition: color 0.15s;
      }

      .action-icon-btn:hover {
        color: var(--token-foreground);
      }

      .action-icon-btn svg {
        width: 16px;
        height: 16px;
      }

      /* Projects section header extra buttons */
      .projects-header-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
      }

      .section-title-row:hover .projects-header-actions,
      .projects-header-actions:focus-within {
        opacity: 1;
        pointer-events: auto;
      }

      .header-icon-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        cursor: pointer;
        padding: 4px;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        color: var(--token-foreground-50);
        transition: color 0.15s;
      }

      .header-icon-btn:hover {
        color: var(--token-foreground);
      }

      .header-icon-btn svg {
        width: 16px;
        height: 16px;
      }

      /* Project folder row */
      .project-row {
        position: relative;
        display: flex;
        height: var(--height-token-row);
        cursor: pointer;
        align-items: center;
        justify-content: space-between;
        overflow: hidden;
        border-radius: var(--radius-token-row);
        font-size: 14px;
        color: var(--token-foreground);
        transition: background-color 0.15s;
      }

      .project-row:hover {
        background-color: var(--token-list-hover-background);
      }

      .project-row .left-area {
        display: flex;
        min-width: 0;
        flex: 1;
        align-items: center;
        gap: 4px;
        padding-left: 4px;
      }

      .project-row .folder-icon {
        margin-left: -3px;
        margin-right: -3px;
        display: flex;
        width: var(--height-token-row);
        height: var(--height-token-row);
        flex-shrink: 0;
        align-items: center;
        justify-content: center;
      }

      .project-row .folder-icon svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .project-row .name-area {
        display: flex;
        min-width: 0;
        flex: 1;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        border-radius: 6px;
        padding: 4px 0 4px 0;
        text-align: left;
        font-size: 14px;
        color: var(--token-foreground);
        cursor: pointer;
      }

      .project-row .name-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding-right: 4px;
      }

      .project-row .right-area {
        display: flex;
        max-width: 50%;
        min-width: 0;
        gap: 4px;
        align-items: center;
      }

      .project-row .hover-btns {
        width: 0;
        overflow: hidden;
        opacity: 0;
        display: flex;
        align-items: center;
        transition: opacity 0.15s;
      }

      .project-row:hover .hover-btns {
        width: auto;
        overflow: visible;
        opacity: 1;
      }

      .project-row .add-btn-wrap {
        margin-right: 2px;
        display: grid;
        height: 24px;
        max-width: 192px;
        min-width: 24px;
        flex-shrink: 1;
        grid-template-columns: 1fr;
        align-items: center;
      }

      .project-row .add-btn-inner {
        grid-column: 1;
        grid-row: 1;
        display: inline-flex;
        justify-self: end;
        opacity: 0;
        transition: opacity 0.15s;
      }

      .project-row:hover .add-btn-inner {
        opacity: 1;
      }

      /* Project children */
      .project-children {
        padding-top: 2px;
        padding-bottom: 8px;
      }

      .project-child-list {
        display: flex;
        flex-direction: column;
      }

      /* Tasks empty state */
      .tasks-empty {
        color: var(--token-description-foreground);
        padding: 8px;
        font-size: 14px;
        opacity: 0.5;
      }

      /* Footer */
      .sidebar-footer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
      }

      .footer-container {
        position: relative;
        width: 100%;
        flex-shrink: 0;
      }

      .footer-top-line {
        pointer-events: none;
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        z-index: 10;
        height: 0.5px;
        background: var(--token-foreground-10);
      }

      .footer-toolbar {
        display: flex;
        height: var(--height-toolbar);
        align-items: center;
        gap: 8px;
        padding-left: var(--padding-row-x);
        padding-right: var(--padding-row-x);
      }

      .footer-left {
        min-width: 0;
        flex: 1;
      }

      .footer-settings-btn {
        display: flex;
        height: var(--height-token-row);
        min-width: 0;
        flex: 1;
        align-items: center;
        gap: 8px;
        border-radius: var(--radius-token-row);
        padding-left: var(--padding-row-cell-x, var(--padding-row-x));
        padding-right: var(--padding-row-cell-x, var(--padding-row-x));
        text-align: left;
        font-size: 14px;
        color: var(--token-foreground);
        border: none;
        background: transparent;
        cursor: pointer;
        width: 100%;
        font-family: inherit;
        transition: background-color 0.15s;
      }

      .footer-settings-btn:hover {
        background-color: var(--token-list-hover-background);
      }

      .footer-settings-btn svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .footer-settings-btn span {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .footer-help-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        cursor: pointer;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: var(--token-text-tertiary);
        flex-shrink: 0;
        transition:
          background-color 0.15s,
          color 0.15s;
      }

      .footer-help-btn:hover {
        background-color: var(--token-list-hover-background);
        color: var(--token-foreground);
      }

      .footer-help-btn svg {
        width: 20px;
        height: 20px;
      }

      /* Resize handle */
      .resize-handle {
        position: absolute;
        top: calc(-1 * var(--height-toolbar));
        right: 0;
        bottom: 0;
        width: 16px;
        transform: translateX(8px);
        cursor: col-resize;
        z-index: 20;
        display: flex;
        touch-action: none;
        user-select: none;
      }

      .resize-handle-line {
        pointer-events: none;
        margin: auto;
        opacity: 0;
        height: 100%;
        width: 1px;
        background: linear-gradient(
          to bottom,
          transparent,
          var(--token-foreground-25),
          transparent
        );
        transition: opacity 0.15s;
      }

      .resize-handle:hover .resize-handle-line,
      .resize-handle:active .resize-handle-line {
        opacity: 1;
      }

      .icon-xs {
        width: 16px;
        height: 16px;
      }

      .icon-2xs {
        width: 12px;
        height: 12px;
      }

      /* Scrollbar styling */
      .scroll-area::-webkit-scrollbar {
        width: 6px;
      }
      .scroll-area::-webkit-scrollbar-track {
        background: transparent;
      }
      .scroll-area::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 3px;
      }

      /* Focus visible outlines */
      button:focus-visible {
        outline: 2px solid var(--token-foreground);
        outline-offset: 2px;
      }

      .sr-only {
        position: fixed;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        margin: -1px;
        border: 0;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(100%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <aside
      class="app-shell-left-panel"
      style="padding-top: var(--height-toolbar); width: 293.748px"
    >
      <div class="panel-inner">
        <div class="panel-content">
          <div
            class="panel-flex-container"
            style="
              --sidebar-footer-height: 46px;
              --sidebar-scroll-content-top-padding: 4px;
              --sidebar-scroll-header-fade-distance: 4px;
              --sidebar-scroll-header-fade-start: 0px;
              --sidebar-scroll-header-spacing: 4px;
            "
          >
            <nav
              class="sidebar-nav"
              role="navigation"
              aria-label="Scheduled task folders"
            >
              <!-- Top Actions -->
              <div class="top-actions">
                <div class="top-actions-group">
                  <div class="top-actions-buttons">
                    <button type="button" class="nav-row-btn">
                      <div class="label-wrap">
                        <span class="icon-wrap">
                          <svg
                            width="16"
                            height="16"
                            viewBox="0 0 16 16"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            class="icon-xs"
                          >
                            <path
                              d="M6.33325 1.88379C6.58178 1.88379 6.78345 2.08546 6.78345 2.33398C6.78328 2.58237 6.58168 2.78418 6.33325 2.78418H4.66626C3.62638 2.78435 2.78362 3.62711 2.78345 4.66699V11.334C2.78361 12.3739 3.62637 13.2176 4.66626 13.2178H11.3333C12.3733 13.2178 13.2169 12.374 13.217 11.334V9.66699C13.2172 9.41872 13.418 9.21795 13.6663 9.21777C13.9147 9.21777 14.1163 9.41861 14.1165 9.66699V11.334C14.1163 12.871 12.8703 14.1172 11.3333 14.1172H4.66626C3.12932 14.117 1.88322 12.8709 1.88306 11.334V4.66699C1.88323 3.13006 3.12933 1.88396 4.66626 1.88379H6.33325Z"
                              fill="currentColor"
                            ></path>
                            <path
                              fill-rule="evenodd"
                              clip-rule="evenodd"
                              d="M10.8948 2.375C11.6494 1.63227 12.8628 1.63698 13.6116 2.38574C14.362 3.13643 14.3637 4.35266 13.6165 5.10644L9.36353 9.39355C9.01402 9.74579 8.56977 9.98985 8.08521 10.0967L6.17603 10.5166C5.74813 10.6107 5.36686 10.2296 5.46118 9.80176L5.88208 7.89746C5.98978 7.4105 6.23578 6.96428 6.59106 6.61426L10.8948 2.375ZM12.9749 3.02148C12.5756 2.62258 11.9289 2.62086 11.5266 3.0166L7.2229 7.25586C6.99148 7.4839 6.83116 7.77457 6.76099 8.0918L6.44165 9.53711L7.89185 9.21777C8.20744 9.14811 8.49721 8.98919 8.72485 8.75976L12.9778 4.47266C13.3759 4.07066 13.375 3.42164 12.9749 3.02148Z"
                              fill="currentColor"
                            ></path>
                          </svg>
                        </span>
                        <span class="text-fade-truncate">New task</span>
                      </div>
                      <span class="kbd-wrap" aria-hidden="true"
                        ><kbd class="kbd-badge">⌘N</kbd></span
                      >
                    </button>
                    <button type="button" class="nav-row-btn">
                      <div class="label-wrap">
                        <span class="icon-wrap">
                          <svg
                            width="16"
                            height="16"
                            viewBox="0 0 16 16"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            class="icon-xs"
                          >
                            <path

    <script>
      // Section toggle functionality
      document.querySelectorAll(".section-toggle-btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          const section = this.dataset.section;
          if (!section) return;

          const content = document.querySelector(
            `[data-section-content="${section}"]`,
          );
          if (!content) return;

          const isExpanded = this.getAttribute("aria-expanded") === "true";

          if (isExpanded) {
            this.setAttribute("aria-expanded", "false");
            this.classList.add("collapsed");
            content.classList.remove("expanded");
            content.classList.add("collapsed-content");
          } else {
            this.setAttribute("aria-expanded", "true");
            this.classList.remove("collapsed");
            content.classList.add("expanded");
            content.classList.remove("collapsed-content");
          }
        });
      });

      // Project row toggle functionality
      document.querySelectorAll(".project-row").forEach((row) => {
        row.addEventListener("click", function (e) {
          // Don't toggle if clicking action buttons
          if (
            e.target.closest(".header-icon-btn") ||
            e.target.closest(".add-btn-inner")
          )
            return;

          const project = this.dataset.project;
          const isCollapsed = this.dataset.collapsed === "true";
          const children = document.querySelector(
            `[data-project-children="${project}"]`,
          );

          if (children) {
            if (isCollapsed) {
              this.dataset.collapsed = "false";
              children.style.display = "";
              children.style.height = "auto";
              children.style.opacity = "1";
              children.style.overflow = "visible";
            } else {
              this.dataset.collapsed = "true";
              children.style.display = "none";
            }
          }
        });
      });
    </script>
